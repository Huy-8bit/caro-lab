services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CARO_CONFIG: /app/configs/quick.yaml
      CARO_DATA_DIR: /data
      CARO_CHECKPOINT_DIR: /checkpoints
      CARO_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./checkpoints:/checkpoints
    restart: unless-stopped
    # Let an in-flight iteration autosave the candidate on shutdown.
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  dashboard:
    build:
      context: .
      args:
        VITE_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
